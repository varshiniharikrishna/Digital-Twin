name: Python checks

on:
  push:
  pull_request:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt ruff==0.11.5
      - run: python -m pytest -q
      - run: ruff check --select E9,F63,F7,F82 .
